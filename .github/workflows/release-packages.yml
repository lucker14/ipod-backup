name: Build release packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing v-prefixed release tag to rebuild and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install --yes apt-utils dpkg-dev gnupg rpm
      - name: Install fpm
        run: gem install fpm --no-document
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not tag.startswith("v"):
              raise SystemExit("Release tags must use the v<version> format.")
          expected = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          actual = tag.removeprefix("v")
          if actual != expected:
              raise SystemExit(f"Release tag {tag!r} does not match pyproject version {expected!r}.")
          PY
      - name: Build release files
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: |
          version="${RELEASE_TAG#v}"
          packaging/linux/build-packages.sh "$version" dist
          packaging/unix/build-portable-archive.sh "$version" dist
          cp packaging/unix/install.sh dist/install.sh
      - name: Create checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Preserve packages for optional APT publishing
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 1
      - name: Attach files to the GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber

  publish-apt:
    if: ${{ vars.APT_REPO_PUBLISH == 'true' && (github.event_name == 'release' || github.ref == 'refs/heads/main') }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist
      - name: Build signed APT repository
        env:
          APT_REPO_SIGNING_KEY: ${{ secrets.APT_REPO_SIGNING_KEY }}
          APT_REPO_SIGNING_KEY_PASSPHRASE: ${{ secrets.APT_REPO_SIGNING_KEY_PASSPHRASE }}
        run: bash packaging/linux/apt/build-repository.sh dist site
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy APT repository to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
