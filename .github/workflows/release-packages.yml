name: Build release packages

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Install RPM tooling
        run: sudo apt-get update && sudo apt-get install --yes rpm
      - name: Install fpm
        run: gem install fpm --no-document
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not tag.startswith("v"):
              raise SystemExit("Release tags must use the v<version> format.")
          expected = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          actual = tag.removeprefix("v")
          if actual != expected:
              raise SystemExit(f"Release tag {tag!r} does not match pyproject version {expected!r}.")
          PY
      - name: Build release files
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version="${RELEASE_TAG#v}"
          packaging/linux/build-packages.sh "$version" dist
          packaging/unix/build-portable-archive.sh "$version" dist
          cp packaging/unix/install.sh dist/install.sh
      - name: Create checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS
      - name: Attach files to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
