name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install --editable .
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Build Python distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m pip install --upgrade build
          python -m build
          python -m venv .venv-package-check
          .venv-package-check/bin/python -m pip install dist/*.whl
          .venv-package-check/bin/ipod-backup-cli --help
          .venv-package-check/bin/ipod-backup-test --help

  linux-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Install package build and APT repository tools
        run: sudo apt-get update && sudo apt-get install --yes apt-utils dpkg-dev gnupg rpm
      - name: Install fpm
        run: gem install fpm --no-document
      - name: Build Linux and portable release assets
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          packaging/linux/build-packages.sh "$version" dist
          packaging/unix/build-portable-archive.sh "$version" dist
          sh -n packaging/unix/install.sh
          packaging/unix/install.sh --help
          test -s "dist/ipod-backup_${version}_all.deb"
          test -s "dist/ipod-backup-${version}-1.noarch.rpm"
          test -s "dist/ipod-backup-${version}.apk"
          test -s dist/ipod-backup-portable.tar.gz
      - name: Test signed APT repository generation
        run: |
          test_gnupg_home="$(mktemp -d)"
          chmod 700 "$test_gnupg_home"
          export GNUPGHOME="$test_gnupg_home"
          trap 'rm -rf "$test_gnupg_home"' EXIT
          gpg --batch --pinentry-mode loopback \
            --passphrase test-only-passphrase \
            --quick-generate-key "iPod Backup CI Test" ed25519 sign 1d
          key_fingerprint="$(gpg --batch --with-colons --list-secret-keys |
            awk -F: '$1 == "fpr" { print $10; exit }')"
          gpg --batch --armor --export-secret-keys "$key_fingerprint" \
            > "$RUNNER_TEMP/apt-test-signing-key.asc"
          export APT_REPO_SIGNING_KEY="$(< "$RUNNER_TEMP/apt-test-signing-key.asc")"
          export APT_REPO_SIGNING_KEY_PASSPHRASE=test-only-passphrase
          bash packaging/linux/apt/build-repository.sh dist "$RUNNER_TEMP/apt-test-site"
          gpgv --keyring "$RUNNER_TEMP/apt-test-site/archive-keyring.gpg" \
            "$RUNNER_TEMP/apt-test-site/dists/stable/InRelease"
          grep -q "Package: ipod-backup" \
            "$RUNNER_TEMP/apt-test-site/dists/stable/main/binary-amd64/Packages"
          test -s "$RUNNER_TEMP/apt-test-site/dists/stable/Release.gpg"
