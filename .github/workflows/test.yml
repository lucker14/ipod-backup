name: Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project
        run: python -m pip install --editable .
      - name: Run unit tests
        run: python -m unittest discover -v
      - name: Build Python distributions
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        run: |
          python -m pip install --upgrade build
          python -m build
          python -m venv .venv-package-check
          .venv-package-check/bin/python -m pip install dist/*.whl
          .venv-package-check/bin/ipod-backup-cli --help
          .venv-package-check/bin/ipod-backup-test --help

  linux-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Install RPM build tools
        run: sudo apt-get update && sudo apt-get install --yes rpm
      - name: Install fpm
        run: gem install fpm --no-document
      - name: Build Linux and portable release assets
        run: |
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          packaging/linux/build-packages.sh "$version" dist
          packaging/unix/build-portable-archive.sh "$version" dist
          sh -n packaging/unix/install.sh
          packaging/unix/install.sh --help
          test -s "dist/ipod-backup_${version}_all.deb"
          test -s "dist/ipod-backup-${version}-1.noarch.rpm"
          test -s "dist/ipod-backup-${version}.apk"
          test -s dist/ipod-backup-portable.tar.gz
