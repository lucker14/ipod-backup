name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  publish:
    if: ${{ vars.PUBLISH_TO_PYPI == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          if not tag.startswith("v"):
              raise SystemExit("Release tags must use the v<version> format.")
          expected = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          actual = tag.removeprefix("v")
          if actual != expected:
              raise SystemExit(f"Release tag {tag!r} does not match pyproject version {expected!r}.")
          PY
      - name: Build distribution
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI with trusted publishing
        uses: pypa/gh-action-pypi-publish@release/v1
