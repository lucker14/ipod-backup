[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ipod-backup"
version = "0.1.2"
description = "Back up files from an iPod mounted as a disk"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Petr Pluhar" }]
dependencies = []

[project.scripts]
ipod-backup = "ipod_backup.interactive:main"
ipod-backup-cli = "ipod_backup.cli:main"
ipod-backup-test = "ipod_backup.device_test:main"

[tool.setuptools.packages.find]
where = ["src"]
