[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ipod-backup"
version = "0.1.1"
description = "Back up files from an iPod mounted as a disk"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Petr Pluhar" }]
dependencies = []

[project.scripts]
ipod-backup = "start_backup:main"
ipod-backup-cli = "ipod_backup:main"
ipod-backup-test = "device_test:main"

[tool.setuptools]
py-modules = ["ipod_backup", "device_test", "start_backup"]
